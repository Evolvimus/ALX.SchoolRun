<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>ALX SchoolRun</title>
  <style>
    html,body{margin:0;height:100%;background:#1b1f3b;overflow:hidden;font-family:system-ui,sans-serif}
    #game{width:100%;height:100%}
    #code-input{position:absolute;display:none;font-size:22px;padding:10px 14px;border-radius:10px;border:3px solid #ffcc33;
      text-transform:uppercase;letter-spacing:2px;text-align:center;width:min(320px,80vw);box-sizing:border-box}
  </style>
</head>
<body>
  <div id="game"></div>
  <input id="code-input" maxlength="14" placeholder="ALX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" />
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
